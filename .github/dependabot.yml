# Aktualizacje wersji raz w miesiącu, zgrupowane, żeby nie mnożyć PR-ów:
# każdy z nich odpala pełne CI (integracja w koszach, e2e real + mocked, CodeQL).
# Majory npm i Postgresa podnosimy świadomie, ręcznie i z planem (Next,
# Mantine, Drizzle, Postgres) — ignorowane tu dotyczą tylko aktualizacji
# wersji; poprawki bezpieczeństwa (Dependabot security updates) przychodzą
# dalej. GitHub Actions celowo dostają też majory: nowe majory akcji zwykle
# wynikają z wycofywania runtime'u Node na runnerach, a zmianę i tak
# sprawdza pełne CI tego PR-a.
# cooldown: nie bierzemy wydań młodszych niż tydzień (ochrona łańcucha dostaw).
# Obraz Node w deploy/Dockerfile jest w ARG (FROM ${NODE_IMAGE}), którego
# Dependabot nie aktualizuje — podnoś go ręcznie razem z node-version w CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Warsaw
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
